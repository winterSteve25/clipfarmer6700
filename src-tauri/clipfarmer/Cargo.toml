[package]
name = "clipfarmer"
version = "0.1.0"
edition = "2024"

[features]
default = []
coreml = ["scribble/coreml"]
cuda = ["scribble/cuda"]
metal = ["scribble/metal"]
vulkan = ["scribble/vulkan"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
scribble = "=0.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
